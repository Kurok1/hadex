name: Build and Push Docker Image to GHCR

on:
  push:
    tags:
      - 'v*' # 匹配 v1.0.0 这样的tag格式

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name and prepare lowercase repository path
        id: extract_tag
        run: |
          echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          echo "LOWERCASE_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.extract_tag.outputs.LOWERCASE_REPO }}:${{ steps.extract_tag.outputs.TAG }}
            ghcr.io/${{ steps.extract_tag.outputs.LOWERCASE_REPO }}:latest